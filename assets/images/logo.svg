<svg width="100%" viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg" role="img">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">LETSKITE wordmark logo</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Horizontal lockup: geometric diamond kite icon on the left, LETSKITE wordmark on the right, all in solid #0055FF</desc>

  <!-- KITE ICON: diamond centered around x=22, y=25, vertically filling ~44px -->
  <!-- Diamond: top(22,3) right(38,25) bottom(22,43) left(6,25) -->
  <!-- Four filled quadrants (cross divides diamond into 4 triangles, alternating solid/outline for depth) -->
  <!-- Top-left quadrant -->
  <path d="M22,25 L22,3 L6,25 Z" fill="#0055FF" style="fill:rgb(0, 85, 255);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Top-right quadrant -->
  <path d="M22,25 L22,3 L38,25 Z" fill="#0055FF" opacity="0.55" style="fill:rgb(0, 85, 255);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.55;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Bottom-right quadrant -->
  <path d="M22,25 L38,25 L22,43 Z" fill="#0055FF" style="fill:rgb(0, 85, 255);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Bottom-left quadrant -->
  <path d="M22,25 L6,25 L22,43 Z" fill="#0055FF" opacity="0.55" style="fill:rgb(0, 85, 255);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.55;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Cross lines (thin, white to divide quadrants) -->
  <line x1="22" y1="3" x2="22" y2="43" stroke="white" stroke-width="0.7" style="fill:rgb(0, 0, 0);stroke:rgb(255, 255, 255);color:rgb(255, 255, 255);stroke-width:0.7px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="6" y1="25" x2="38" y2="25" stroke="white" stroke-width="0.7" style="fill:rgb(0, 0, 0);stroke:rgb(255, 255, 255);color:rgb(255, 255, 255);stroke-width:0.7px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Bridle/tail lines from bottom tip -->
  <path d="M22,43 Q18,49 15,48" fill="none" stroke="#0055FF" stroke-width="1.3" stroke-linecap="round" style="fill:none;stroke:rgb(0, 85, 255);color:rgb(255, 255, 255);stroke-width:1.3px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <path d="M22,43 Q26,49 29,48" fill="none" stroke="#0055FF" stroke-width="1.3" stroke-linecap="round" style="fill:none;stroke:rgb(0, 85, 255);color:rgb(255, 255, 255);stroke-width:1.3px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- WORDMARK: outlined paths for "LETSKITE" -->
  <!-- Rendered as text for accuracy, positioned at x=46, baseline y=36, ~28px tall condensed bold -->
  <text x="46" y="35" font-family="'Arial Narrow', 'Barlow Condensed', 'Impact', 'Franklin Gothic Demi Cond', sans-serif" font-size="27" font-weight="900" letter-spacing="-0.5" fill="#0055FF" dominant-baseline="auto" style="fill:rgb(0, 85, 255);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Arial Narrow&quot;, &quot;Barlow Condensed&quot;, Impact, &quot;Franklin Gothic Demi Cond&quot;, sans-serif;font-size:27px;font-weight:900;text-anchor:start;dominant-baseline:auto">LETSKITE</text>
</svg>