<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" role="img">
  <title>LetsKite</title>
  <desc>LetsKite kiteboarding school logo — electric blue kite icon with wordmark</desc>

  <g transform="translate(10, 40)">

    <!-- Kite body: filled delta diamond -->
    <!-- top(0,-30) right(18,0) bottom(0,12) left(-18,0) -->
    <path d="M0,-30 L18,0 L0,12 L-18,0 Z" fill="#0055ff"/>

    <!-- Spine and crossbar highlights -->
    <line x1="0" y1="-30" x2="0" y2="12" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.3"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" opacity="0.3"/>

    <!-- Left bridle -->
    <path d="M0,12 Q-7,23 -4,38" fill="none" stroke="#0055ff" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Right bridle -->
    <path d="M0,12 Q7,23 4,38" fill="none" stroke="#0055ff" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Tail connector -->
    <path d="M-4,38 Q0,44 4,38" fill="none" stroke="#0055ff" stroke-width="2" stroke-linecap="round"/>

    <!-- Wordmark -->
    <text
      x="30"
      y="7"
      font-family="'Bebas Neue', 'Arial Narrow', Impact, sans-serif"
      font-size="44"
      font-weight="700"
      fill="#0055ff"
      letter-spacing="2"
      dominant-baseline="middle"
      text-anchor="start">LETSKITE</text>

  </g>
</svg>
