<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | LetsKite</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    /* Auth button hover effects */
    .btn-primary {
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(var(--primary-rgb, 0, 120, 212), 0.4);
      filter: brightness(1.1);
    }
    .btn-primary:active {
      transform: translateY(0);
      box-shadow: none;
    }
    .social-login .btn {
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .social-login .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    }
    .social-login .btn:active {
      transform: translateY(0);
      box-shadow: none;
    }
  </style>
</head>
<body>

  <main class="auth-page">
    <div class="auth-toggles">
      <button class="icon-btn theme-toggle" aria-label="Toggle Theme"></button>
      <button class="icon-btn rtl-toggle" aria-label="Toggle RTL"></button>
    </div>

    <div class="auth-card">
      <a href="index.html" class="auth-logo"><img src="assets/images/logo.svg" alt="LetsKite Logo"></a>
      <h1 style="font-size: 2rem; margin-bottom: var(--space-1);">Welcome Back</h1>
      <p style="color: var(--text-muted); margin-bottom: var(--space-4);">Login to manage your bookings</p>

      <form class="needs-validation" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-control" required>
          <div class="error-msg"></div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" class="form-control" required minlength="8">
            <button type="button" class="password-toggle" aria-label="Toggle Password Visibility"></button>
          </div>
          <div class="error-msg"></div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-3);">
          <div class="checkbox-group" style="margin-bottom: 0;">
            <input type="checkbox" id="remember">
            <label for="remember" style="margin-bottom: 0; font-weight: normal; font-size: 0.875rem;">Remember Me</label>
          </div>
          <a href="#" style="font-size: 0.875rem; color: var(--primary);">Forgot Password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-full mt-2">Login</button>
      </form>

      <div style="margin: var(--space-4) 0; position: relative; text-align: center;">
        <hr style="border: none; border-top: 1px solid var(--card-border);">
        <span style="position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: var(--card-bg); padding: 0 8px; color: var(--text-muted); font-size: 0.875rem;">OR</span>
      </div>

      <div class="social-login">
        <button class="btn btn-full">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" style="width: 20px; height: 20px; margin-right: 8px; display: inline-block;">
          Continue with Google
        </button>
        <button class="btn btn-full">
          <i class="ph ph-apple-logo" style="font-size: 1.25rem; margin-right: 8px;"></i>
          Continue with Apple
        </button>
      </div>

      <p style="margin-top: var(--space-4); color: var(--text-muted);">
        Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: bold;">Register</a>
      </p>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
